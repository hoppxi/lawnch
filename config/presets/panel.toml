[meta]
name        = "Sidebar Right"
description = "Tall, narrow panel snapping to the right edge of the screen"

[window]
width           = 380
height          = 900
anchor          = ["right", "center"]
margin          = [20, 20, 20, 0]
background      = "$surface"
border          = { radius = 16, width = 1, color = "$surface-container-highest" }
exclusive       = true
ignore-exclusive = false
keyboard        = "exclusive"
font            = { family = "sans-serif" }

[widget.input]
font            = { size = 15, weight = "normal" }
color           = "$on-surface"
placeholder     = { text = "Filter...", color = "$outline" }
background      = "$surface-container-low"
border          = { radius = 8, width = 1, color = "$surface-container-highest" }
caret           = { width = 2.0, color = "$primary" }
selection       = { background = "$primary-container", color = "$on-surface" }
padding         = [12, 12, 12, 12]
align           = "left"

[widget.input.prompt]
enable          = false

[widget.results]
margin          = [10, 0, 0, 0]
padding         = [10, 10, 10, 10]
gap             = 6
border          = { radius = 0, width = 0, color = "#00000000" }
scroll          = "follow"
reverse         = false

[widget.results.scrollbar]
enable          = true

[widget.results.scrollbar.track]
width           = 3
color           = "#00000000"
padding         = [0]
margin          = [0]
radius          = 2

[widget.results.scrollbar.thumb]
color           = "$secondary"
radius          = 2

[widget.results.item]
icon            = { size = 20, gap = 10, enable = true }
comment         = true
highlight       = true

[widget.results.item.default]
align           = "left"
font            = { size = 14, weight = "normal" }
color           = "$on-surface-variant"
background      = "#00000000"
border          = { radius = 6, width = 1, color = "transparent" }
padding         = [8, 10, 8, 10]
margin          = [0]
comment         = { font = { size = 11, weight = "normal" }, color = "$outline" }
highlight       = { font = { size = 14, weight = "bold" }, color = "$tertiary" }

[widget.results.item.selected]
color           = "$on-surface"
background      = "$surface-container-high"
border          = { radius = 6, width = 1, color = "$outline-variant" }
comment         = { font = { size = 11, weight = "normal" }, color = "$secondary" }
highlight       = { font = { size = 14, weight = "bold" }, color = "$primary" }

[widget.preview]
enable          = true

[widget.results.count]
enable          = true
format          = "{count} items found"
font            = { size = 11, weight = "normal" }
color           = "$outline"
align           = "center"
padding         = [10, 0, 10, 0]

[widget.clock]
enable          = true

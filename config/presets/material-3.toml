[meta]
name        = "Material 3"
description = "Rounded, spacious, inspired by Material Design 3"

[appearance.layout]
preview-side    = "right"
preview-ratio   = 40

[window]
width           = 500
height          = 400
anchor          = ["center"]
margin          = [50, 0, 0, 0]
background      = "$surface"
border          = { radius = 28, width = 0, color = "$primary" }
exclusive       = false
ignore-exclusive = false
keyboard        = "exclusive"
font            = { family = "sans-serif" }

[widget.input]
font            = { size = 18, weight = "normal" }
color           = "$on-surface"
placeholder     = { text = "Search apps and files...", color = "$outline" }
background      = "#00000000"
border          = { radius = 16, width = 0, color = "#00000000" }
caret           = { width = 2.0, color = "$primary" }
selection       = { background = "$primary-container", color = "$on-surface" }
padding         = [16, 20, 16, 20]
align           = "left"

[widget.input.prompt]
enable          = true
text            = ""
side            = "left"
font            = { size = 18, weight = "bold" }
color           = "$primary"
background      = "#00000000"
border          = { radius = 0, width = 0, color = "#00000000" }
padding         = [16, 0, 16, 20]

[widget.results]
margin          = [8, 0, 0, 0]
padding         = [8, 12, 8, 12]
gap             = 4
background      = "#00000000"
border          = { radius = 16, width = 0, color = "#00000000" }
scroll          = "follow"
reverse         = false

[widget.results.scrollbar]
enable          = true

[widget.results.scrollbar.track]
width           = 6
color           = "$surface-container-high"
padding         = [0]
margin          = [0]
radius          = 3

[widget.results.scrollbar.thumb]
color           = "$primary"
radius          = 3

[widget.results.item]
icon            = { size = 24, gap = 14, enable = true }
comment         = true
highlight       = true

[widget.results.item.default]
align           = "left"
font            = { size = 16, weight = "normal" }
color           = "$on-surface"
background      = "#00000000"
border          = { radius = 16, width = 0, color = "#FFFFFF1A" }
padding         = [14, 16, 14, 16]
margin          = [0]
comment         = { font = { size = 12, weight = "normal" }, color = "$outline" }
highlight       = { font = { size = 16, weight = "bold" }, color = "$primary" }

[widget.results.item.selected]
color           = "$secondary"
background      = "$primary-container"
border          = { radius = 16, width = 0, color = "$primary" }
comment         = { font = { size = 12, weight = "normal" }, color = "$on-primary-container" }
highlight       = { font = { size = 16, weight = "bold" }, color = "$primary" }

[widget.preview]
enable          = true
composition     = ["preview_image", "icon:name", "comment"]
image-size      = 64
icon            = { size = 14, fallback = true, hide-on-fallback = true }
padding         = [140, 16, 16, 16]
margin          = [0]
background      = "#00000000"
gap             = { v = 8, h = 8 }

[widget.preview.name]
font            = { size = 16, weight = "bold" }
color           = "$on-surface"

[widget.preview.comment]
font            = { size = 12, weight = "normal" }
color           = "$outline"

[widget.results.count]
enable          = true
format          = "{count} matches found"
font            = { size = 12, weight = "normal" }
color           = "$outline"
align           = "right"
padding         = [4]

[widget.clock]
enable          = true
format          = "%H:%M"
font            = { size = 16, weight = "bold" }
color           = "$outline"
align           = "left"
padding         = [10, 20, 10, 20]

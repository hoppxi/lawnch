[meta]
name        = "Retro Terminal"
description = "Blocky, unrounded, monospace fonts and thick borders"

[window]
width           = 800
height          = 400
anchor          = ["center"]
margin          = [0, 0, 0, 0]
background      = "$surface"
border          = { radius = 0, width = 4, color = "$primary" }
exclusive       = false
ignore-exclusive = true
keyboard        = "exclusive"
font            = { family = "monospace" }

[widget.input]
font            = { size = 18, weight = "bold" }
color           = "$on-surface"
placeholder     = { text = "C:\\>", color = "$outline" }
background      = "$surface"
border          = { radius = 0, width = 0, color = "#00000000" }
caret           = { width = 10.0, color = "$primary" }
selection       = { background = "$primary-container", color = "$on-surface" }
padding         = [15, 20, 15, 20]
align           = "left"

[widget.input.prompt]
enable          = true

[widget.results]
margin          = [0, 0, 0, 0]
padding         = [10, 10, 10, 10]
gap             = 0
border          = { radius = 0, width = 2, color = "$surface-container-highest" }
scroll          = "follow"
reverse         = false

[widget.results.scrollbar]
enable          = true

[widget.results.scrollbar.track]
width           = 12
color           = "$surface-container-low"
padding         = [0]
margin          = [0]
radius          = 0

[widget.results.scrollbar.thumb]
color           = "$primary"
radius          = 0

[widget.results.item]
icon            = { size = 0, gap = 0, enable = false }
comment         = true
highlight       = true

[widget.results.item.default]
align           = "left"
font            = { size = 16, weight = "normal" }
color           = "$on-surface-variant"
background      = "$surface"
border          = { radius = 0, width = 0, color = "#00000000" }
padding         = [4, 10, 4, 10]
margin          = [0]
comment         = { font = { size = 12, weight = "normal" }, color = "$secondary" }
highlight       = { font = { size = 16, weight = "bold" }, color = "$tertiary" }

[widget.results.item.selected]
color           = "$surface"
background      = "$primary"
border          = { radius = 0, width = 0, color = "$primary" }
comment         = { font = { size = 12, weight = "normal" }, color = "$surface-dim" }
highlight       = { font = { size = 16, weight = "bold" }, color = "$inverse-surface" }

[widget.preview]
enable          = false

[widget.results.count]
enable          = true
format          = "TOTAL:{count}"
font            = { size = 14, weight = "bold" }
color           = "$primary"
align           = "right"
padding         = [10, 20, 10, 20]

[widget.clock]
enable          = false
